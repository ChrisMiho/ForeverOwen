name: Release

# Runs when a version tag such as v0.1.0 is pushed. The packager stamps the
# version into the .toc, builds the zip (leaving out the files ignored in
# .pkgmeta) and attaches it to a GitHub release.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history, for the changelog

      - uses: BigWigsMods/packager@v2.7.0 # keep in step with scripts/build.sh
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
